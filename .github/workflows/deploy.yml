# Deploy ขึ้น Cloudflare แบบกดเอง — GitHub → Actions → "Deploy to Cloudflare" → Run workflow
# ใช้โค้ดที่ commit อยู่บน main (ไม่ deploy อัตโนมัติตอน push)
# ต้องตั้ง secrets ใน repo ก่อน: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (Settings → Secrets and variables → Actions)
name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      migrate:
        description: "อัปเดตตารางฐานข้อมูลก่อน deploy (รัน worker/schema.sql — ใช้เมื่อมีการแก้ schema)"
        type: boolean
        default: false

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'   # deploy ได้เฉพาะ branch main
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: ติดตั้ง wrangler (ตาม package-lock.json)
        run: npm ci

      - name: เช็กการตั้งค่า
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::ยังไม่ได้ตั้ง secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::ยังไม่ได้ตั้ง secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          if grep -q '"database_id": "00000000-0000-0000-0000-000000000000"' wrangler.jsonc; then
            echo "::error::wrangler.jsonc ยังไม่มี database_id จริง — สร้าง D1 (npx wrangler d1 create banrimphoo) แล้ว commit ก่อน"; exit 1
          fi

      - name: อัปเดตตารางฐานข้อมูล
        if: ${{ inputs.migrate }}
        run: npx wrangler d1 execute banrimphoo --remote --file worker/schema.sql

      - name: Deploy
        run: npx wrangler deploy --message "${GITHUB_SHA::7} by ${GITHUB_ACTOR}"

      - name: สรุป
        run: |
          echo "### ✅ Deploy แล้ว" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${GITHUB_SHA::7}\` — $(git log -1 --pretty=%s)" >> "$GITHUB_STEP_SUMMARY"
          echo "- อัปเดตตารางฐานข้อมูล: ${{ inputs.migrate }}" >> "$GITHUB_STEP_SUMMARY"
