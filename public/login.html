<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บ้านริมภู · เข้าสู่ระบบ</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--ink:#1f2a24;--muted:#6b756f;--line:#e3e0d8;--accent:#2f6b4f;--accent-soft:#e3efe8;--danger:#b3261e;--danger-soft:#fbe3e1}
@media (prefers-color-scheme: dark){:root{--bg:#141816;--panel:#1d2320;--ink:#e6ebe8;--muted:#97a39c;--line:#2f3733;--accent:#6cc39a;--accent-soft:#22362c;--danger:#ef7a72;--danger-soft:#3d2321}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:flex-end;padding:16px 8vw;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Sukhumvit Set","Noto Sans Thai",system-ui,sans-serif}
.bg{position:fixed;inset:0;z-index:-1}
.bg.photo{background:center/cover no-repeat}
.bg.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,0) 60%)}
.hero{position:fixed;left:7vw;top:12vh;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.35);max-width:44vw}
.hero h2{margin:0;font-size:clamp(34px,5vw,64px);line-height:1.1;letter-spacing:.5px}
.hero p{margin:10px 0 0;font-size:clamp(15px,1.5vw,19px);opacity:.95}
.box{width:100%;max-width:370px;background:color-mix(in srgb,var(--panel) 84%,transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:18px;padding:28px 26px;box-shadow:0 18px 50px rgba(0,0,0,.18)}
.logo{width:64px;height:64px;margin:0 auto;border-radius:18px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.15)}
@media (max-width:760px){
  body{justify-content:center;align-items:flex-end;padding:16px 16px 6vh}
  .hero{left:16px;right:16px;top:8vh;max-width:none;text-align:center}
}
h1{margin:4px 0 2px;text-align:center;font-size:22px;color:var(--accent)}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:20px}
label{display:block;font-size:13px;color:var(--muted);margin-top:12px}
input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;margin-top:4px}
input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
button{margin-top:20px;width:100%;border:0;background:var(--accent);color:#fff;padding:10px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{margin-top:14px;background:var(--danger-soft);color:var(--danger);padding:8px 10px;border-radius:8px;font-size:14px;display:none}
.note{margin-top:14px;font-size:13px;color:var(--muted);background:var(--accent-soft);padding:8px 10px;border-radius:8px}
</style>
</head>
<body>
<div class="bg" id="bg" data-scene></div>
<div class="hero"><h2>บ้านริมภู</h2><p>ที่พักริมภูเขา · ท่ามกลางสายหมอกและธรรมชาติ</p></div>
<form class="box" id="f">
  <div class="logo" data-scene="logo"></div>
  <h1>บ้านริมภู</h1>
  <div class="sub" id="sub">เข้าสู่ระบบจัดการที่พัก</div>
  <div class="note" id="setupNote" hidden>ยังไม่มีผู้ใช้ — ตั้งชื่อผู้ใช้และรหัสผ่านสำหรับเข้าระบบครั้งแรก</div>
  <label>ชื่อผู้ใช้<input name="username" autocomplete="username" required maxlength="40"></label>
  <label>รหัสผ่าน<input name="password" type="password" autocomplete="current-password" required></label>
  <label id="pw2Wrap" hidden>ยืนยันรหัสผ่าน<input name="password2" type="password" autocomplete="new-password"></label>
  <button id="btn">เข้าสู่ระบบ</button>
  <div class="err" id="err"></div>
</form>
<script src="/scene.js?v=4" defer></script>
<script>
// มีรูปจริง (photo.jpg) → ใช้แทนภาพวาด
{ const im = new Image(); im.onload = () => { const bg = document.getElementById('bg'); bg.innerHTML = ''; bg.className = 'bg photo'; bg.style.backgroundImage = 'url(/photo.jpg)'; }; im.src = '/photo.jpg'; }
const f = document.getElementById('f'), err = document.getElementById('err'), btn = document.getElementById('btn');
let setup = false;
function showErr(m) { err.textContent = m; err.style.display = m ? 'block' : 'none'; }
(async () => {
  try {
    const me = await (await fetch('/api/me', { cache: 'no-store' })).json();
    if (me.user) return location.replace('/');
    setup = me.setup;
  } catch { showErr('ติดต่อเซิร์ฟเวอร์ไม่ได้'); }
  if (setup) {
    document.getElementById('setupNote').hidden = false;
    document.getElementById('pw2Wrap').hidden = false;
    document.getElementById('sub').textContent = 'ตั้งค่าผู้ใช้ครั้งแรก';
    f.password.autocomplete = 'new-password'; f.password.minLength = 8; f.password2.required = true;
    f.password.placeholder = 'อย่างน้อย 8 ตัวอักษร';
    btn.textContent = 'สร้างผู้ใช้และเข้าสู่ระบบ';
  }
  f.username.focus();
})();
f.onsubmit = async e => {
  e.preventDefault(); showErr('');
  if (setup && f.password.value !== f.password2.value) return showErr('รหัสผ่านทั้งสองช่องไม่ตรงกัน');
  btn.disabled = true;
  try {
    const r = await fetch(setup ? '/api/setup' : '/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: f.username.value.trim(), password: f.password.value }),
    });
    const j = await r.json();
    if (r.ok) return location.replace('/');
    showErr(j.error || 'เข้าสู่ระบบไม่สำเร็จ');
    f.password.select();
  } catch { showErr('ติดต่อเซิร์ฟเวอร์ไม่ได้'); }
  btn.disabled = false;
};
</script>
</body>
</html>
